name: Saudi Economy Daily

on:
  workflow_dispatch:

  schedule:
    # 08:00 Riyadh
    - cron: "0 8 * * *"
      timezone: "Asia/Riyadh"

    # 14:00 Riyadh
    - cron: "0 14 * * *"
      timezone: "Asia/Riyadh"

    # 20:00 Riyadh
    - cron: "0 20 * * *"
      timezone: "Asia/Riyadh"

permissions:
  contents: write

concurrency:
  group: saudi-economy-daily
  cancel-in-progress: false

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 pypdf

      - name: Fetch, analyze and publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APINEX_API_KEY: ${{ secrets.APINEX_API_KEY }}
          LEGACY_MODEL: ${{ secrets.LEGACY_MODEL }}
          LEGACY_FALLBACK_MODEL: ${{ secrets.LEGACY_FALLBACK_MODEL }}
          LEGACY_EXTRA_MODELS: ${{ secrets.LEGACY_EXTRA_MODELS }}
          # Emergency mode: publish the original headline/source/link if all AI calls fail.
          ALLOW_SOURCE_ONLY_FALLBACK: true
        run: |
          python src/fetch_news.py

      - name: Save processed state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed_articles.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update news state"

            # A code/configuration commit may land while this scheduled job is
            # running. Rebase the state commit onto the latest main before push.
            # Retry once to handle a second concurrent update without losing state.
            for attempt in 1 2; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin HEAD:main; then
                  echo "Processed state saved successfully."
                  exit 0
                fi
              else
                echo "State rebase failed on attempt $attempt; aborting rebase."
                git rebase --abort || true
              fi

              if [ "$attempt" -eq 1 ]; then
                echo "State push conflicted; retrying after refreshing main."
                sleep 2
              fi
            done

            echo "::error::Could not save processed state after two attempts."
            exit 1
          fi
