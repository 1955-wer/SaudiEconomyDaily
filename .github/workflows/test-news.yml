name: Saudi Economy Daily

on:
  workflow_dispatch:

  push:
    paths-ignore:
      - "data/**"

  schedule:
    # 08:00 Riyadh
    - cron: "0 8 * * *"
      timezone: "Asia/Riyadh"

    # 14:00 Riyadh
    - cron: "0 14 * * *"
      timezone: "Asia/Riyadh"

    # 20:00 Riyadh
    - cron: "0 20 * * *"
      timezone: "Asia/Riyadh"

permissions:
  contents: write

concurrency:
  group: saudi-economy-daily
  cancel-in-progress: false

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 pypdf

      - name: Install Hermes Agent
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive --skip-browser --skip-computer-use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          hermes --version

      - name: Fetch, analyze and publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HERMES_PROVIDER: ${{ secrets.HERMES_PROVIDER }}
          HERMES_MODEL: ${{ secrets.HERMES_MODEL }}
          LEGACY_MODEL: ${{ secrets.LEGACY_MODEL }}
          LEGACY_FALLBACK_MODEL: ${{ secrets.LEGACY_FALLBACK_MODEL }}
          HERMES_WEB_BACKEND: ${{ secrets.HERMES_WEB_BACKEND }}
          HERMES_DISCOVERY_LIMIT: ${{ secrets.HERMES_DISCOVERY_LIMIT }}
          HERMES_DISCOVERY_TURNS: ${{ secrets.HERMES_DISCOVERY_TURNS }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
        run: |
          python src/fetch_news.py

      - name: Save processed state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed_articles.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update news state"
            git push
          fi
