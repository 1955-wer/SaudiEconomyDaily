name: Saudi Economy Daily

on:
  workflow_dispatch:

  # GitHub cron runs in UTC. Riyadh is UTC+3, so:
  # 08:00 Riyadh = 05:00 UTC, 12:00 = 09:00, 16:00 = 13:00, 20:00 = 17:00
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"

permissions:
  contents: write

concurrency:
  group: saudi-economy-daily
  cancel-in-progress: false

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 pypdf

      - name: Fetch, analyze and publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APINEX_API_KEY: ${{ secrets.APINEX_API_KEY }}
          APINEX_BASE_URL: https://tokenharbor.ai/v1
          LEGACY_MODEL: ${{ secrets.LEGACY_MODEL }}
          LEGACY_FALLBACK_MODEL: ${{ secrets.LEGACY_FALLBACK_MODEL }}
          LEGACY_EXTRA_MODELS: ${{ secrets.LEGACY_EXTRA_MODELS }}
          # Emergency mode: publish the original headline/source/link if all AI calls fail.
          ALLOW_SOURCE_ONLY_FALLBACK: true
        run: |
          python src/fetch_news.py

      - name: Save processed state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed_articles.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "chore: update news state"

          # Another push (for example a manual code upload) may land while
          # this job runs. Rebase our state commit onto the latest main and
          # retry. On a conflict, keep this run's state file (-X theirs
          # refers to our commit during a rebase).
          for attempt in 1 2 3 4; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "Processed state saved successfully."
              exit 0
            fi

            echo "Push rejected on attempt $attempt; retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done

          echo "::error::Could not save processed state after 4 attempts."
          exit 1
