name: Test Hermes Research

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 pypdf

      - name: Install Hermes Agent
        shell: bash
        run: |
          set +e
          bash ./scripts/install_hermes.sh
          status=$?
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          if [ "$status" -ne 0 ]; then
            echo "::error::Hermes installation failed."
            exit "$status"
          fi
          hermes --version

      - name: Run Hermes smoke test
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HERMES_MODEL: ${{ vars.HERMES_MODEL || 'inclusionai/ling-3.0-flash-fin:free' }}
          HERMES_MAX_TURNS: "6"
          HERMES_MAX_CANDIDATES: "1"
          HERMES_TIMEOUT_SECONDS: "300"
          HERMES_WEB_BACKEND: ${{ vars.HERMES_WEB_BACKEND || 'firecrawl' }}
        run: |
          python src/test_hermes.py
